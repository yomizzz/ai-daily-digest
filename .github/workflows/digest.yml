name: Daily AI Digest

on:
  schedule:
    # 每天 UTC 18:00 = 北京时间凌晨 2:00
    - cron: '0 18 * * *'
  # 支持手动触发（workflow_dispatch）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser httpx pyyaml openai

      - name: Fetch and preserve existing data
        run: |
          # 保留 hermes 条目（hermes_updater 维护），只允许 blog 被 main.py 刷新
          mkdir -p data
          if git ls-files data/articles.json | grep -q data/articles.json; then
            git checkout origin/main -- data/articles.json 2>/dev/null || echo '{}' > data/articles.json
          else
            echo '{"articles": [], "last_updated": ""}' > data/articles.json
          fi
          # 如果 articles.json 是空的（hermes_updater 还没运行过），初始化空结构
          if [ ! -s data/articles.json ] || [ "$(cat data/articles.json)" = "{}" ]; then
            echo '{"articles": [], "last_updated": ""}' > data/articles.json
          fi

      - name: Run digest pipeline
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          python src/main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          # 只有有变化时才 commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update digest: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
