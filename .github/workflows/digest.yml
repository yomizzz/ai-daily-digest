name: Daily AI Digest

on:
  schedule:
    # 每天 UTC 18:00 = 北京时间凌晨 2:00
    - cron: '0 18 * * *'
  # 支持手动触发（workflow_dispatch）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser httpx pyyaml openai

      - name: Fetch latest data from remote
        run: |
          # 尝试从远程拉取最新的 articles.json（支持增量累积）
          # 如果远程存在则合并，如果不存在则创建空数据
          mkdir -p data
          if git ls-files data/articles.json | grep -q data/articles.json; then
            echo "从 git 恢复历史数据..."
            git checkout origin/main -- data/articles.json 2>/dev/null || echo "{}" > data/articles.json
          else
            echo "首次运行，创建空数据文件"
            echo '{"articles": [], "last_updated": ""}' > data/articles.json
          fi

      - name: Run digest pipeline
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          python src/main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          # 只有有变化时才 commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update digest: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
