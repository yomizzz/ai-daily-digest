name: Hermes Agent Updates

on:
  schedule:
    # 上海时间 10:00 = UTC 02:00
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - initial

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Fetch latest data from remote
        run: |
          mkdir -p data
          if git ls-files data/hermes-updates.json | grep -q data/hermes-updates.json; then
            echo "从 git 恢复历史数据..."
            git checkout origin/main -- data/hermes-updates.json 2>/dev/null || echo '{"releases":[]}' > data/hermes-updates.json
          else
            echo "首次运行，创建空数据文件"
            echo '{"releases": [], "last_updated": ""}' > data/hermes-updates.json
          fi

      - name: Fetch hermes-agent releases
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          MODE="${{ inputs.mode || 'incremental' }}"
          echo "运行模式: $MODE"
          python src/hermes_updater.py "$MODE"

      - name: Generate hermes-updates.html
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from generator import PageGenerator
          gen = PageGenerator()
          path = gen.generate_hermes_updates()
          print(f'生成页面: {path}')
          "

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update hermes-agent releases: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
