name: Hermes Agent Updates

on:
  schedule:
    # 上海时间 10:00 = UTC 02:00
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - initial

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Fetch and summarize hermes-agent releases
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          MODE="${{ inputs.mode || 'incremental' }}"
          FORCE_FLAG=""
          if [ "$MODE" = "initial" ]; then FORCE_FLAG="--force"; fi
          echo "运行模式: $MODE, force: $FORCE_FLAG"
          python src/hermes_updater.py "$MODE" $FORCE_FLAG

      - name: Generate HTML pages
        run: |
          python src/generator.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update hermes-agent releases: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
